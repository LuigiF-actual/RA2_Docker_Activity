services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    image: bitnami/wordpress
    restart: always
    environment:
      WORDPRESS_DATABASE_HOST: mysql
      WORDPRESS_DATABASE_PORT_NUMBER: 3306
      WORDPRESS_DATABASE_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DATABASE_USER: ${MYSQL_USER}
      WORDPRESS_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_BLOG_NAME: ${WORDPRESS_BLOG_NAME}
      WORDPRESS_USERNAME: ${WORDPRESS_USERNAME}
      WORDPRESS_PASSWORD: ${WORDPRESS_PASSWORD}
      WORDPRESS_EMAIL: ${WORDPRESS_EMAIL}
      WORDPRESS_ENABLE_REVERSE_PROXY: "yes"
      WORDPRESS_HOSTNAME: "wordpress.lvh.me:8443"
    ports:
      - "${WORDPRESS_PORT}:8080"
    volumes:
      - wordpress_data:/bitnami/wordpress
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network
  https-portal:
    image: steveltn/https-portal:1
    restart: always
    ports:
      - "8083:80"
      - "8443:443"
    environment:
      STAGE: local
      DOMAINS: "wordpress.lvh.me -> http://wordpress:8080"
    volumes:
      - ssl_certs_data:/var/lib/https-portal
    depends_on:
      - wordpress
    networks:
      - frontend-network

volumes:
  mysql_data:
  wordpress_data:
  ssl_certs_data:

networks:
  frontend-network:
  backend-network:
