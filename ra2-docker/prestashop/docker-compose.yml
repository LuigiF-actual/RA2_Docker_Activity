services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - seccomp:unconfined

  prestashop:
    image: prestashop/prestashop:8
    restart: unless-stopped
    environment:
      PS_INSTALL_AUTO: "1"
      DB_SERVER: mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      PS_DOMAIN: ${PS_DOMAIN}
      PS_ENABLE_SSL: "1"
      PS_COUNTRY: es
      PS_LANGUAGE: es
      PS_FOLDER_ADMIN: admin-stucom
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWD}
    volumes:
      - prestashop_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - prestashop
    networks:
      - frontend-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "9081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  https-portal:
    image: steveltn/https-portal:1
    restart: unless-stopped
    ports:
      - "9080:80"
      - "9443:443"
    environment:
      STAGE: local
      DOMAINS: "prestashop.localhost -> http://nginx:80"
      PROXY_ADD_X_FORWARDED_HEADERS: "true"
    volumes:
      - ssl_certs_data:/var/lib/https-portal
    depends_on:
      - nginx
    networks:
      - frontend-network

volumes:
  mysql_data:
  prestashop_data:
  ssl_certs_data:

networks:
  frontend-network:
  backend-network:
